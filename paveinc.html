<section class="section" id="paver-enquiry">
<h2 style="color:#c5a028;">Paver Block Enquiry</h2>

<form action="https://formspree.io/f/mqegbwya" method="POST" style="max-width:600px;">

<input type="text" name="name" placeholder="Full Name" required />
<input type="email" name="email" placeholder="Email Address" required />
<input type="tel" name="phone" placeholder="Phone / WhatsApp Number" required />

<!-- PACKAGE -->
<select id="package" name="package" required onchange="calculateTotal()">
<option value="">Select Package</option>
<option value="1000">100 Bricks (R1000)</option>
<option value="2000">200 Bricks (R2000)</option>
</select>

<!-- PALLETS -->
<input 
type="number" 
id="pallets" 
name="pallets" 
placeholder="Number of Pallets" 
min="1" 
required 
oninput="calculateTotal()" 
/>

<!-- TOTAL DISPLAY -->
<div id="totalPrice" class="price">Total: R0</div>

<button type="submit">Request Quote</button>

</form>
</section>
